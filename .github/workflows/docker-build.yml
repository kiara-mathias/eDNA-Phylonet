name: docker-build

# Validates that `docker build .` succeeds from a clean checkout, using
# GitHub's own runners -- this is the portability check for contributors
# (including the project author) who don't have Docker installed locally.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build main image (ingest/preprocess)
        run: docker build -t edna-classifier:ci .

      - name: Build inference image (dashboard)
        run: docker build -t edna-classifier-inference:ci -f Dockerfile.inference .

      # No reference data is available in CI (data/processed/ is
      # gitignored, and fetching it live from BOLD is out of scope for a
      # build check), so this only proves the container starts cleanly and
      # the app's own "no data found" message renders -- not a real
      # inference smoke test. See app/dashboard.py's missing-data handling.
      - name: Smoke-test inference image starts
        run: |
          docker run -d --name edna-dashboard -p 8501:8501 edna-classifier-inference:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "Dashboard is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Dashboard did not become healthy in time"
          docker logs edna-dashboard
          exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Provides makeblastdb/blastn for the Step 6 BLAST baseline tests
      # (tests/test_blast_baseline.py) -- skipped when unavailable (e.g.
      # local dev), so installing it here means CI actually exercises them.
      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline unit tests
        run: pytest tests/ -v
