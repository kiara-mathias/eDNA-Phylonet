# Config for the deployed inference pipeline (Step 7 of the build plan).
#
# Deliberately separate from configs/eval.yaml: eval.yaml's splits hold out
# entire genera to *measure* zero-shot generalization, whereas the deployed
# dashboard should exploit every known genus -- it splits off a small,
# random (non-clade-excluded) validation slice purely to calibrate
# HierarchicalFallback's novelty thresholds, then fits on everything else.
# encoder/classifier/fallback values mirror eval.yaml's tuned defaults.

data:
  sequences_path: data/processed/sequences.parquet

# Fraction of rows held back (uniformly at random, not by clade) to
# calibrate HierarchicalFallback's per-rank confidence thresholds.
val_fraction: 0.15
seed: 42

encoder:
  k: 4
  n_components: 50
  random_state: 42

classifier:
  seq_weight: 0.8
  geo_weight: 0.2

fallback:
  rank_percentile: 90.0
  # Must match configs/eval.yaml so dashboard confidence matches the
  # benchmarked HierarchicalFallback (see sample_count_prior there).
  sample_count_prior: 5.0
  # How many nearest known species *and* genera to attach to every
  # prediction (surfaced on novel flags so "closest relative" is a
  # ranked, inspectable list rather than a single name). Typical 3-5.
  n_nearest_relatives: 5

# Written by src/eval/benchmark.py; the dashboard's Benchmark tab reads
# this to render the Step 6 comparison results (shows a "run benchmark
# first" message if missing).
benchmark_results_path: data/eval_results/benchmark.json

# Written by src/eval/validate_calibration.py (Step 1). Dashboard Calibration
# tab renders the reliability diagram live from this JSON (and optionally
# rebins heldout_predictions.parquet when that file is present).
calibration_results_path: data/eval_results/calibration/calibration.json

# Written by src/eval/head_to_head.py (Step 2). Dashboard FCW tab plots the
# saved false-confident-wrong curves with method toggles + a threshold slider.
head_to_head_results_path: data/eval_results/head_to_head/head_to_head.json
