# Config for the clade-exclusion splitter (Step 3) and the base
# embedding+classifier validation run (Step 4).
#
# All paths are repo-root-relative (see src/common.py); no absolute paths.

data:
  sequences_path: data/processed/sequences.parquet

splitter:
  # Held-out unit is genus, not family: the dataset (see data/manifest.json)
  # only spans 5 families but 151 genera, so family-level holdout at
  # 30/50/70% would round to 1-4 families -- too coarse for a real curve.
  # Genus-level holdout gives statistically meaningful splits while we
  # still report family-level accuracy as the benchmark metric.
  unit: genus
  holdout_fractions: [0.3, 0.5, 0.7]
  # Fraction of the *seen* (non-held-out) rows set aside as validation, to
  # sanity-check ordinary (non-zero-shot) generalization alongside the
  # zero-shot test set.
  val_fraction: 0.15
  seed: 42
  splits_dir: data/splits

encoder:
  # "kmer_pca" (default), "conv_triplet" (small 1D CNN + triplet loss),
  # or "dnabert" (frozen Hugging Face DNA model; optional extra deps).
  name: kmer_pca
  # k-mer size for the frequency-vector encoder (4^k dimensions before PCA).
  k: 4
  n_components: 50
  random_state: 42
  conv_triplet:
    embedding_dim: 32
    n_filters: 16
    kernel_size: 7
    max_len: 256
    epochs: 8
    batch_size: 32
    learning_rate: 0.05
    margin: 0.4
    # Cap the triplet-training subset so a full BOLD table stays CPU-feasible.
    max_train_sequences: 2000
  dnabert:
    model_id: zhihan1996/DNABERT-2-117M
    max_len: 256
    batch_size: 8
    device: cpu
    trust_remote_code: true

encoder_comparison:
  names: [kmer_pca, conv_triplet]
  default_confidence_threshold: 0.5
  output_dir: data/eval_results/encoder_comparison

classifier:
  # Weights for combining normalized sequence-embedding distance and
  # normalized geographic (haversine) distance into a single nearest-
  # centroid ranking. Geo term is dropped (renormalized) when coordinates
  # are missing for a given comparison.
  seq_weight: 0.8
  geo_weight: 0.2

fallback:
  # Percentile of the val split's (in-distribution) nearest-distance
  # distribution used to calibrate each rank's confidence threshold. Higher
  # = more permissive (fewer false novelty flags on known queries, but also
  # less sensitive to genuinely novel ones). Reuses classifier.seq_weight /
  # classifier.geo_weight for the underlying distance combination.
  rank_percentile: 90.0
  # Pseudocount for sample-size reliability: reported confidence is multiplied
  # by n / (n + prior) for the nearest label's training support. Cascade commit
  # decisions still use raw distance vs. threshold; this only makes confidence
  # honest for thinly sampled centroids. Set 0 to disable.
  sample_count_prior: 5.0
  # Top-k known species and genera reported with every prediction so a
  # novel-taxon "closest relative" claim is inspectable. Typical 3-5.
  n_nearest_relatives: 5

benchmark:
  # Resample the test set with replacement this many times per system/rank
  # to produce percentile CIs around coverage and accuracy-among-answered.
  n_bootstrap: 1000
  ci_level: 0.95
  seed: 42

calibration:
  # Equal-width bins on [0, 1] for reliability diagrams / ECE.
  n_bins: 10
  # If any rank's held-out ECE exceeds this, fit a post-hoc map from raw
  # confidence -> P(correct) via leave-one-holdout-out on the other holdouts'
  # test predictions (in-distribution val does not transfer to zero-shot).
  ece_threshold: 0.1
  # "isotonic" (nonparametric, default) or "platt" (logistic / Platt scaling).
  method: isotonic
  auto_recalibrate: true
  output_dir: data/eval_results/calibration

head_to_head:
  # Operating-point threshold for the table's false-confident-wrong-call
  # rate. The dashboard slider sweeps [0, 1] against the saved curve.
  default_confidence_threshold: 0.5
  # Which saved split becomes the single published table + plot.
  table_holdout_fraction: 0.5
  plot_rank: species
  plot_subset: novel
  n_thresholds: 21
  output_dir: data/eval_results/head_to_head
  # BLAST confidence proxy: bitscore / (bitscore + offset). Smaller offset
  # makes modest hits look more confident.
  blast_bitscore_offset: 50.0

baselines:
  naive_bayes:
    # k-mer size for the raw frequency vectors fed to MultinomialNB (mirrors
    # QIIME2's actual classifier algorithm, which works on raw k-mer/feature
    # counts rather than a PCA-reduced embedding).
    k: 4
  blast:
    # Rebuilt per run from the current split's train sequences; not
    # committed (see .gitignore).
    db_dir: data/blast_db
    evalue: 1.0e-10
    # Standard COI species-level %identity cutoff from the barcoding
    # literature (not tuned against this dataset). A top hit below this is
    # treated as "no confident call" -- i.e. BLAST fails outright, per this
    # project's framing of exact-match tools' failure mode.
    min_pident: 97.0
